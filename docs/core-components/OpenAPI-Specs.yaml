openapi: 3.0.3
info:
  title: Auth System API
  description: Multi-tenant authentication and authorization system
  version: 1.0.0
  contact:
    name: Auth System
    email: alekellegard@protonmail.com

servers:
  - url: http://localhost:3001/api
    description: Development server
  - url: https://auth.example.com/api
    description: Production server

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Session-based authentication via HTTP-only cookies
    
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for client-server API authentication

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique user identifier
        name:
          type: string
          minLength: 3
          maxLength: 50
          pattern: "^[a-zA-Z]+$"
        email:
          type: string
          format: email
          maxLength: 50
        role:
          type: string
          enum: [user, admin, owner]
        schema:
          type: string
          description: Database schema (tenant identifier)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        authorized_urls:
          type: array
          items:
            type: string
            format: uri
          description: URLs this user is authorized to access
      required: [role, schema]
      anyOf:
        - required: [id]
        - required: [name, email]

    LoginRequest:
      type: object
      properties:
        credentials:
          type: object
          properties:
            email:
              type: string
              format: email
            password:
              type: string
              minLength: 8
          required: [email, password]
        returnUrl:
          type: string
          format: uri
          description: URL to redirect to after successful login
      required: [credentials]

    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 50
          pattern: "^[a-zA-Z]+$"
        email:
          type: string
          format: email
          maxLength: 50
        password:
          type: string
          minLength: 8
          maxLength: 100
          description: Must contain uppercase, lowercase, and digit
        role:
          type: string
          enum: [user, admin]
          default: user
      required: [name, email, password]

    ClientServer:
      type: object
      properties:
        client_id:
          type: string
          description: Unique client identifier
        app_name:
          type: string
          description: Human-readable application name
        assigned_schema_name:
          type: string
          description: Database schema assigned to this client
        allowed_return_urls:
          type: array
          items:
            type: string
            format: uri
          description: URLs allowed for authentication redirects
        client_mode:
          type: string
          enum: [frontend-login-proxy, api-auth-server]
          default: frontend-login-proxy
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ApiResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          description: Response payload (varies by endpoint)
      required: [message]

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
              field:
                type: string

paths:
  # Authentication Endpoints
  /auth/login:
    post:
      tags: [Authentication]
      summary: User login
      description: Authenticate user with email/password and create session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              credentials:
                email: user@example.com
                password: securepassword123
              returnUrl: https://client-app.com/dashboard
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/register:
    post:
      tags: [Authentication]
      summary: User registration
      description: Register a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Validation error or user already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: User logout
      description: Destroy user session and logout
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/session:
    get:
      tags: [Authentication]
      summary: Get current session
      description: |
        Get current authentication & authorization context.
        
        **Single source of truth** consumed by:
        - Auth-System's own frontend (owner/admin dashboards)
        - Every onboarded client application (to protect routes)
        - Automated tests & monitoring
        
        Returns user details including authorized URLs for client-side route protection.
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Session retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
              example:
                message: "User retrieved successfully"
                data:
                  id: "123e4567-e89b-12d3-a456-426614174000"
                  name: "Alice"
                  email: "alice@example.com"
                  role: "user"
                  schema: "client_trading_sim"
                  authorized_urls: [
                    "https://trading-sim.com",
                    "https://trading-sim.com/app"
                  ]
        '401':
          description: Not authenticated / session expired
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [NOT_AUTHENTICATED]
        '403':
          description: Session exists but revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [SESSION_REVOKED]

  # User Management Endpoints
  /users:
    get:
      tags: [User Management]
      summary: Get all users
      description: Retrieve all users (admin only)
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          users:
                            type: array
                            items:
                              $ref: '#/components/schemas/User'

  /users/{id}:
    get:
      tags: [User Management]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - sessionAuth: []
      responses:
        '200':
          description: User retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [User Management]
      summary: Update user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 50
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                role:
                  type: string
                  enum: [user, admin]
      security:
        - sessionAuth: []
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'

  # Client Server Management
  /clientServer/register:
    post:
      tags: [Client Server Management]
      summary: Register new client server
      description: Register a new client application (public API - no authentication required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                app_name:
                  type: string
                  description: Human-readable application name
                allowed_return_urls:
                  type: array
                  items:
                    type: string
                    format: uri
                  description: URLs allowed for authentication redirects
              required: [app_name, allowed_return_urls]
      responses:
        '201':
          description: Client server registered successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          client_id:
                            type: string
                          client_secret:
                            type: string
                            description: Only returned during registration
                          app_name:
                            type: string
                          assigned_schema_name:
                            type: string
                          allowed_return_urls:
                            type: array
                            items:
                              type: string

  /clientServer/handshake:
    post:
      tags: [Client Server Management]
      summary: Client server authentication
      description: Authenticate client server and receive API token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                client_secret:
                  type: string
              required: [client_id, client_secret]
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          token:
                            type: string
                            description: JWT token for API authentication
                          expires_in:
                            type: integer
                            description: Token expiry in seconds
                          schema:
                            type: string
                            description: Database schema for this client

  /clientServer/me:
    get:
      tags: [Client Server Management]
      summary: Get current client server info
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Client server info retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ClientServer'

tags:
  - name: Authentication
    description: User authentication and session management
  - name: User Management
    description: User CRUD operations (admin only)
  - name: Client Server Management
    description: Client application registration and management