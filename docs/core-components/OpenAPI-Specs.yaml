        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                schema_name:
                  type: string
                  pattern: "^client_[a-z0-9_]+$"
                  description: Schema name (must start with 'client_')
