            type: string
          description: Client server ID
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: User ID
      responses:
        '200':
          description: User retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - not owner or admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User or client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [Owner Management]
      summary: Update user in client schema
      description: Update a user in a specific client application's schema
      security:
        - sessionAuth: []
      parameters:
        - name: clientId
          in: path
          required: true
          schema:
            type: string
          description: Client server ID
        - name: userId
          in: path
          required: true
          schema:
            type: string
          description: User ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  pattern: '^(?=.*[A-Z])(?=.*[a-z])(?=.*\d).{8,}$'
                  description: |
                    Password must be at least 8 characters and contain:
                    - At least one uppercase letter
                    - At least one lowercase letter
                    - At least one digit
                  example: "Password123"
                role:
                  type: string
                  enum: [user, admin]
      responses:
