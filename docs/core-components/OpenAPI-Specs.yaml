  /owner/clients/{clientId}/users/{userId}:
    get:
      tags: [Owner Management]
      summary: Get specific user in client schema
      description: Retrieve a specific user from a client application's schema
      security:
        - sessionAuth: []
      parameters:
        - name: clientId
          in: path
          required: true
