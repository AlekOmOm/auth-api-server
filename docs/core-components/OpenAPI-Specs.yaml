        '200':
          description: Schemas retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            schema_name:
                              type: string
                            client_id:
                              type: string
                            app_name:
                              type: string
