openapi: 3.0.3
info:
  title: Auth System API
  description: Multi-tenant authentication and authorization system
  version: 1.0.0
  contact:
    name: Auth System
    email: alekellegard@protonmail.com

servers:
  - url: http://localhost:3001/api
    description: Development server
  - url: https://auth.example.com/api
    description: Production server

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Session-based authentication via HTTP-only cookies
    
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for client-server API authentication

  parameters:
    SchemaContext:
      name: X-Schema-Context
      in: header
      required: false
      schema:
        type: string
      description: |
        URL or JSON for multi-tenant schema detection.
        Required when operating on tenant-specific data.
        Format: URL string or {"refererUrl": "URL"}
        Example: "http://localhost:3000/" or {"refererUrl": "http://localhost:3000/"}

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique user identifier
        name:
          type: string
          minLength: 3
          maxLength: 50
          pattern: "^[a-zA-Z]+$"
        email:
          type: string
          format: email
          maxLength: 50
        role:
          type: string
          enum: [user, admin, owner]
          description: |
            User role in the system:
            - admin: Full system access, all schemas
            - owner: Manage own client applications only
            - user: Basic user operations in assigned schema
        schema:
          type: string
          description: Database schema (tenant identifier)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        authorized_urls:
          type: array
          items:
            type: string
            format: uri
          description: URLs this user is authorized to access
      required: [role, schema]
      anyOf:
        - required: [id]
        - required: [name, email]

    LoginRequest:
      type: object
      properties:
        credentials:
          type: object
          properties:
            email:
              type: string
              format: email
            password:
              type: string
              minLength: 8
              pattern: '^(?=.*[A-Z])(?=.*[a-z])(?=.*\d).{8,}$'
              description: |
                Password must be at least 8 characters and contain:
                - At least one uppercase letter
                - At least one lowercase letter  
                - At least one digit
              example: "Password123"
        returnUrl:
          type: string
          format: uri
          description: URL to redirect to after successful login
        schema:
          type: string
          description: "Optional. The schema context for the login request. If not provided and not set by preceding middleware, defaults to 'auth_internal'."
      required: [credentials]

    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 50
          pattern: "^[a-zA-Z ]+$"
        email:
          type: string
          format: email
          maxLength: 50
        password:
          type: string
          minLength: 8
          maxLength: 100
          pattern: '^(?=.*[A-Z])(?=.*[a-z])(?=.*\d).{8,}$'
          description: |
            Password must be at least 8 characters and contain:
            - At least one uppercase letter
            - At least one lowercase letter
            - At least one digit
          example: "Password123"
        role:
          type: string
          enum: [user, admin, owner]
          description: "The role to assign to the new user. The validity of the role depends on the registration context (e.g., 'owner'/'admin' for auth_internal, 'user' for client schemas). Backend validation enforces context-specific role assignment."
      required: [name, email, password, role]

    ClientServer:
      type: object
      required:
        - app_name
        - allowed_return_urls
      properties:
        client_id:
          type: string
          description: Unique client identifier (generated)
          example: "client_f47ac10b58cc4372a567"
        client_secret:
          type: string
          description: Client secret (only returned on registration)
        app_name:
          type: string
          description: Human-readable application name
        identifier_url:
          type: string
          format: uri
          description: Primary URL for schema detection (defaults to first allowed_return_url)
          example: "https://myapp.com"
        entry_point_url:
          type: string
          format: uri
          description: Entry point URL for the client application
        authorized_urls:
          type: array
          items:
            type: string
            format: uri
          description: URLs authorized for schema detection (defaults to allowed_return_urls)
        allowed_return_urls:
          type: array
          items:
            type: string
            format: uri
          description: OAuth redirect URLs
        assigned_schema_name:
          type: string
          description: PostgreSQL schema assigned to this client
          example: "client_myapp_1234567890"
        owner_id:
          type: string
          format: uuid
          description: User ID of the client owner
        client_mode:
          type: string
          enum: [frontend-login-proxy, api-auth-server]
          default: frontend-login-proxy
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ApiResponse:
      type: object
      properties:
        message:
          type: string
        data:
          type: object
          description: Response payload (varies by endpoint)
      required: [message]

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
              field:
                type: string

paths:
  # Authentication Endpoints
  /auth/login:
    post:
      tags: [Authentication]
      summary: User login
      description: Authenticate user with email/password and create session
      parameters:
        - $ref: '#/components/parameters/SchemaContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              credentials:
                email: user@example.com
                password: securepassword123
              returnUrl: https://client-app.com/dashboard
              # Example including optional schema
              # schema: "client_schema_xyz"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Validation error. This can include invalid credentials or if a schema cannot be determined and the default schema is misconfigured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                schemaDeterminationFailure:
                  summary: Schema determination failure
                  value:
                    message: "Schema could not be determined for the request, and default schema is invalid or not configured."
                    errors: []
                invalidCredentialsExample:
                  summary: Invalid input (example)
                  value:
                    message: "Validation failed for login."
                    errors:
                      - field: "credentials.email"
                        message: "Email is required and must be a valid email format."

  /auth/register:
    post:
      tags: [Authentication]
      summary: User registration
      description: Register a new user account
      parameters:
        - $ref: '#/components/parameters/SchemaContext'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Validation error. This can include issues like invalid input, or if a schema cannot be determined and the default schema is misconfigured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingSchema:
                  summary: Schema determination failure
                  value:
                    message: "Schema could not be determined for the request, and default schema is invalid or not configured."
                    errors: []
                validationFailed:
                  summary: Standard validation failure
                  value:
                    message: "Validation failed."
                    errors:
                      - field: "email"
                        message: "must be a valid email address"

  /auth/logout:
    post:
      tags: [Authentication]
      summary: User logout
      description: Destroy user session and logout
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/session:
    get:
      tags: [Authentication]
      summary: Get current session
      description: |
        Get current authentication & authorization context.
        
        **Single source of truth** consumed by:
        - Auth-System's own frontend (owner/admin dashboards)
        - Every onboarded client application (to protect routes)
        - Automated tests & monitoring
        
        Returns user details including authorized URLs for client-side route protection.
      parameters:
        - $ref: '#/components/parameters/SchemaContext'
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Session retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
              example:
                message: "User retrieved successfully"
                data:
                  id: "123e4567-e89b-12d3-a456-426614174000"
                  name: "Alice"
                  email: "alice@example.com"
                  role: "user"
                  schema: "client_trading_sim"
                  authorized_urls: [
                    "https://trading-sim.com",
                    "https://trading-sim.com/app"
                  ]
        '401':
          description: Not authenticated / session expired
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [NOT_AUTHENTICATED]
        '403':
          description: Session exists but revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum: [SESSION_REVOKED]

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get current user (non-admin)
      description: Get the currently authenticated user's information (excludes admin users)
      security:
        - sessionAuth: []
      responses:
        '200':
          description: User retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - User is admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/admin:
    get:
      tags: [Authentication]
      summary: Get current admin user
      description: Get the currently authenticated admin user's information
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Admin user retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - User is not admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/sessions:
    post:
      tags: [Authentication]
      summary: Get all sessions for current user
      description: Retrieve all active sessions for the authenticated user
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Sessions retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sessions:
                            type: array
                            items:
                              type: object
                              properties:
                                session_id:
                                  type: string
                                user_id:
                                  type: string
                                ip_address:
                                  type: string
                                user_agent:
                                  type: string
                                created_at:
                                  type: string
                                  format: date-time
                                expires_at:
                                  type: string
                                  format: date-time
                                is_current:
                                  type: boolean
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # User Management Endpoints
  /users:
    get:
      tags: [User Management]
      summary: Get all users
      description: Retrieve all users (admin only)
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          users:
                            type: array
                            items:
                              $ref: '#/components/schemas/User'

  /users/{id}:
    get:
      tags: [User Management]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - sessionAuth: []
      responses:
        '200':
          description: User retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [User Management]
      summary: Update user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 50
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                  pattern: '^(?=.*[A-Z])(?=.*[a-z])(?=.*\d).{8,}$'
                  description: |
                    Password must be at least 8 characters and contain:
                    - At least one uppercase letter
                    - At least one lowercase letter
                    - At least one digit
                  example: "Password123"
                role:
                  type: string
                  enum: [user, admin]
      security:
        - sessionAuth: []
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'

  # Client Server Management
  /clientServer/register:
    post:
      tags: [Client Server Management]
      summary: Register new client server
      description: Register a new client application (public API - no authentication required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                app_name:
                  type: string
                  description: Human-readable application name
                allowed_return_urls:
                  type: array
                  items:
                    type: string
                    format: uri
                  description: URLs allowed for authentication redirects
              required: [app_name, allowed_return_urls]
      responses:
        '201':
          description: Client server registered successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          client_id:
                            type: string
                          client_secret:
                            type: string
                            description: Only returned during registration
                          app_name:
                            type: string
                          assigned_schema_name:
                            type: string
                          allowed_return_urls:
                            type: array
                            items:
                              type: string

  /clientServer/handshake:
    post:
      tags: [Client Server Management]
      summary: Client server authentication
      description: Authenticate client server and receive API token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                client_secret:
                  type: string
              required: [client_id, client_secret]
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          token:
                            type: string
                            description: JWT token for API authentication
                          expires_in:
                            type: integer
                            description: Token expiry in seconds
                          schema:
                            type: string
                            description: Database schema for this client

  /clientServer/me:
    get:
      tags: [Client Server Management]
      summary: Get current client server info
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Client server info retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ClientServer'

    put:
      tags: [Client Server Management]
      summary: Update current client server info
      description: Update the authenticated client server's information
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                app_name:
                  type: string
                  description: Human-readable application name
                allowed_return_urls:
                  type: array
                  items:
                    type: string
                    format: uri
                  description: URLs allowed for authentication redirects
      responses:
        '200':
          description: Client server updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ClientServer'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /clientServer/user/register:
    post:
      tags: [Client Server Management]
      summary: Register client server for logged-in user
      description: Register a new client application for the authenticated user (creates owner relationship)
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                app_name:
                  type: string
                  description: Human-readable application name
                allowed_return_urls:
                  type: array
                  items:
                    type: string
                    format: uri
                  description: URLs allowed for authentication redirects
                client_mode:
                  type: string
                  enum: [frontend-login-proxy, api-auth-server]
                  default: frontend-login-proxy
              required: [app_name, allowed_return_urls]
      responses:
        '201':
          description: Client server registered successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          client_id:
                            type: string
                          client_secret:
                            type: string
                            description: Only returned during registration
                          app_name:
                            type: string
                          assigned_schema_name:
                            type: string
                          allowed_return_urls:
                            type: array
                            items:
                              type: string
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /clientServer/user/clients:
    get:
      tags: [Client Server Management]
      summary: Get all client servers for user
      description: Retrieve all client applications owned by the authenticated user
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Client servers retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          clients:
                            type: array
                            items:
                              $ref: '#/components/schemas/ClientServer'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /clientServer/user/clients/{client_id}:
    get:
      tags: [Client Server Management]
      summary: Get specific client server for user
      description: Retrieve a specific client application owned by the authenticated user
      security:
        - sessionAuth: []
      parameters:
        - name: client_id
          in: path
          required: true
          schema:
            type: string
          description: Client server ID
      responses:
        '200':
          description: Client server retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ClientServer'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Client server not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [Client Server Management]
      summary: Update client server for user
      description: Update a client application owned by the authenticated user (owner/admin only)
      security:
        - sessionAuth: []
      parameters:
        - name: client_id
          in: path
          required: true
          schema:
            type: string
          description: Client server ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                app_name:
                  type: string
                  description: Human-readable application name
                allowed_return_urls:
                  type: array
                  items:
                    type: string
                    format: uri
                  description: URLs allowed for authentication redirects
                client_mode:
                  type: string
                  enum: [frontend-login-proxy, api-auth-server]
      responses:
        '200':
          description: Client server updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ClientServer'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - not owner or admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Client server not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Client Server Management]
      summary: Delete client server for user
      description: Delete a client application owned by the authenticated user (owner/admin only)
      security:
        - sessionAuth: []
      parameters:
        - name: client_id
          in: path
          required: true
          schema:
            type: string
          description: Client server ID
      responses:
        '200':
          description: Client server deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - not owner or admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Client server not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /clientServer/{client_id}:
    get:
      tags: [Client Server Management]
      summary: Get client server by ID
      description: Retrieve any client server by ID (admin only)
      security:
        - sessionAuth: []
      parameters:
        - name: client_id
          in: path
          required: true
          schema:
            type: string
          description: Client server ID
      responses:
        '200':
          description: Client server retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ClientServer'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - not admin
          content:
            application/json:
              schema:
