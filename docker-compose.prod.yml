# prod

services:
  db:
    build:
      context: ./db
      args:
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      args:
        DEV_BACKEND_PORT: ${DEV_BACKEND_PORT}
    ports:
      - "${DEV_BACKEND_PORT}:${DEV_BACKEND_PORT}"
    environment:
      NODE_ENV: development
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db # service name 
      DEV_BACKEND_PORT: ${DEV_BACKEND_PORT}
      DEV_FRONTEND_PORT: ${DEV_FRONTEND_PORT}
    depends_on:
      - db
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      args:
        DEV_FRONTEND_PORT: ${DEV_FRONTEND_PORT}
    ports:
      - "${DEV_FRONTEND_PORT}:${DEV_FRONTEND_PORT}"
    environment:
      NODE_ENV: production
      DEV_FRONTEND_PORT: ${DEV_FRONTEND_PORT}
      DEV_BACKEND_PORT: ${DEV_BACKEND_PORT}
    depends_on:
      - backend
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge 